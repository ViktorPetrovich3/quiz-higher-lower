<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Выше или Ниже — Тестовая страница</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <span class="badge">Тестовый запуск</span>
      <h1>Выше или Ниже?</h1>
      <p>Угадай, какой запрос или тема популярнее. Сервер успешно отдает статические файлы!</p>
      
      <div class="comparison-box">
        <div class="item">
          <h3>Котики</h3>
          <p class="score">1 250 000</p>
        </div>
        <div class="vs">VS</div>
        <div class="item">
          <h3>Собачки</h3>
          <p class="score">???</p>
        </div>
      </div>

      <div class="buttons">
        <button class="btn btn-higher">Выше ▲</button>
        <button class="btn btn-lower">Ниже ▼</button>
      </div>
    </div>
  </div>
</body>
</html>
